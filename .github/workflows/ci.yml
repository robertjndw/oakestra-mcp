name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # The UI links @oakestra/dashboard-sdk and @oakestra/ui from this repository, checked out at
  # the commit in ui/DASHBOARD_REF.
  DASHBOARD_REPO: robertjndw/oakestra-dashboard-v2

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    steps:
      # package.json links ../../oakestra-dashboard-v2, so both checkouts sit side by side.
      - uses: actions/checkout@v5
        with:
          path: oakestra-mcp
      - name: Read dashboard ref
        id: dashboard
        run: echo "ref=$(tr -d '[:space:]' < oakestra-mcp/ui/DASHBOARD_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.DASHBOARD_REPO }}
          ref: ${{ steps.dashboard.outputs.ref }}
          path: oakestra-dashboard-v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: oakestra-mcp/ui/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dashboard packages
        working-directory: oakestra-dashboard-v2
        run: pnpm install --frozen-lockfile --filter "@oakestra/dashboard-sdk..." --filter "@oakestra/ui..."
      - name: Install
        working-directory: oakestra-mcp/ui
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: oakestra-mcp/ui
        run: pnpm typecheck
      - name: Test
        working-directory: oakestra-mcp/ui
        run: pnpm test
      - name: Build
        working-directory: oakestra-mcp/ui
        run: pnpm build

  images:
    name: Image ${{ matrix.image }}
    needs: [go, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oakestra-mcp
            context: .
          - image: oakestra-mcp-ui
            context: ui
    steps:
      - uses: actions/checkout@v5
      - name: Check out the dashboard for the UI build
        if: matrix.image == 'oakestra-mcp-ui'
        run: |
          ref=$(tr -d '[:space:]' < ui/DASHBOARD_REF)
          git init -q "$RUNNER_TEMP/dashboard"
          git -C "$RUNNER_TEMP/dashboard" fetch -q --depth 1 "https://github.com/$DASHBOARD_REPO.git" "$ref"
          git -C "$RUNNER_TEMP/dashboard" checkout -q FETCH_HEAD
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # oakestra-addon.json pulls :latest, so main keeps it current. Tags add the semver tags.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Oakestra root orchestrators run on arm64 boards as well as on x86 servers.
          platforms: linux/amd64,linux/arm64
          build-contexts: ${{ matrix.image == 'oakestra-mcp-ui' && format('dashboard={0}/dashboard', runner.temp) || '' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
