# Runs the MCP server and its dashboard UI as an addon of an already running dashboard dev stack.
#
# Prerequisite: the dashboard was started from its own checkout with
#
#   docker compose -f compose.dev.yml up --build -d
#
# which creates the project `oakestra-dashboard-dev` with its mock addons manager and mock
# system-manager. This file only joins that stack's network; it never starts or stops the
# dashboard. Then, from this repository's root:
#
#   docker compose -f compose.dashboard.yml up --build -d
#
# This file does not register the addon. Do that in the dashboard (http://localhost:8080, Admin /
# Admin): add oakestra-addon.json to the marketplace and install it. The mock addons manager does
# not start containers, so the ones defined here stand in for the services the manifest names:
# addonui-oakestra-mcp is the alias the addons engine gives the UI service, and root_mcp the
# container name it gives the "mcp" service, so the manifest's API_UPSTREAM works unchanged.
#
# The mock system-manager only mocks the dashboard's API: token checks and the application and
# service tools work against its data, but there is no resource abstractor, so the cluster, node
# and placement tools report that resource data is unavailable.
#
# The UI image pulls the dashboard packages from GitHub Packages, so export NODE_AUTH_TOKEN with
# a token that has read:packages first, e.g. `export NODE_AUTH_TOKEN=$(gh auth token)`.
#
# Tear down with `docker compose -f compose.dashboard.yml down` before taking the dashboard down,
# otherwise the dashboard's `down` cannot remove its network while these containers use it.
name: oakestra-mcp-addon

services:
  # The dashboard's nginx proxies /addon-assets/oakestra-mcp/ to this name. Compose adds the
  # service name as a DNS alias on the shared network, so the dashboard resolves it from its own
  # project.
  addonui-oakestra-mcp:
    build:
      context: ./ui
      dockerfile: Dockerfile
      secrets: [NODE_AUTH_TOKEN]
    environment:
      # Same value as in oakestra-addon.json.
      API_UPSTREAM: http://root_mcp:8090
    depends_on:
      - mcp

  mcp:
    build: .
    networks:
      default:
        aliases: [root_mcp]
    environment:
      # Service name and container port of the dashboard stack's mock system-manager.
      OAKESTRA_API_URL: ${OAKESTRA_API_URL:-http://mock-system-manager:10000}
      MCP_ENABLE_WRITES: ${MCP_ENABLE_WRITES:-false}
    ports:
      # Lets agents on the host connect directly, as they would to port 8090 on a root
      # orchestrator.
      - "${MCP_PORT:-8090}:8090"
    volumes:
      - mcp-data:/data

volumes:
  mcp-data:

secrets:
  NODE_AUTH_TOKEN:
    environment: NODE_AUTH_TOKEN

networks:
  # Created by the dashboard's compose.dev.yml (project oakestra-dashboard-dev), so it must exist
  # before this file is started. Point DASHBOARD_NETWORK at <project>_default if yours differs.
  default:
    name: ${DASHBOARD_NETWORK:-oakestra-dashboard-dev_default}
    external: true
